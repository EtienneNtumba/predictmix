[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "predictmix"
version = "0.2.0"
description = "Integrated Polygenic + Clinical Disease Risk Prediction Pipeline"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Etienne Ntumba Kabongo", email = "etienne.kabongo@mcgill.ca" },
    { name = "Emile R. Chimusa", email = "emile.chimusa@northumbria.ac.uk" },
]
keywords = ["genomics", "machine-learning", "disease-prediction", "PRS", "deep-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.22",
    "pandas>=1.4",
    "scikit-learn>=1.0",
    "scipy>=1.8",
    "joblib>=1.1",
    "pyyaml>=6.0",
    "typer>=0.9",
    "matplotlib>=3.5",
    "lime>=0.2",
    "typing_extensions>=4.0",
    "packaging>=21.0",
]

[project.optional-dependencies]
torch = ["torch>=1.13"]
dev   = ["pytest", "black", "ruff", "mypy"]

[project.scripts]
predictmix = "predictmix.cli:main"

[project.urls]
Homepage   = "https://github.com/EtienneNtumba/predictmix"
Repository = "https://github.com/EtienneNtumba/predictmix"
Issues     = "https://github.com/EtienneNtumba/predictmix/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["predictmix*"]
